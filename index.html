 $('copy').onclick=function(){var b=$('copy'),t='My LED strip: '+name+' ('+cl+'), '+p+' pads, '+(v||'voltage unknown')+'. '+what;
  try{navigator.clipboard.writeText(t).then(function(){b.textContent='Copied'})}catch(e){b.textContent='Copy not available'}};
}
function score(){var s=55;if(S.conf!=1)s+=10;if(S.volt)s+=/label|Printed/.test(S.vsrc)?20:10;if(S.chip)s+=20;if(S.hidden)s-=15;if(S.kind=='pix'&&S.pins==4&&S.lab===''&&!S.chip)s-=8;return Math.max(15,Math.min(97,s))}
function meter(sc,conf){var col=conf==3?'#2fd37a':conf==2?'#0a9bff':'#ff9a1f';return '<div class="mrow"><div class="meter" role="img" aria-label="Confidence '+sc+' percent"><i style="width:'+sc+'%;background:'+col+'"></i></div><small>Estimated confidence '+sc+'%. This is a rough estimate from your answers, not a measurement.</small></div>'}
function mains(){$('card').innerHTML='<h2>Mains (AC) LED strip</h2><div class="tags"><span class="c2">Very likely</span><span>AC mains plug</span></div><p>A strip or rope that plugs straight into a wall socket runs on mains voltage. It is a different product from the low-voltage strips this tool is built for.</p><div class="warn"><b>Safety:</b> Do not cut it, rewire it, or connect it to a low-voltage controller, WLED or an ESP board. Only use a dimmer or smart plug that is rated for LED loads at its voltage. For colour effects or smart control, a 5V, 12V or 24V strip with its own power supply is a safer choice, and this tool can help you identify one.</div><div class="row"><button class="ghost" id="again">Start over</button></div>';$('again').onclick=function(){reset();render()}}
var MK=['Small arrows (→) between the LEDs or near the ends mean a pixel strip. They point the way data flows.','Letters beside the pads or wires: DI, DO or DIN (data), CI or CLK (clock), BI (backup data), R G B W (colour channels), WW CW (warm and cool white).','A voltage print such as DC5V, DC12V or DC24V on the strip edge, reel or box.','LED size such as 5050 (square) or 2835 (small rectangle), which helps with power estimates.','A model number or label on the case or box. Search it online with the words WLED or LED controller.'];
function more(k,v,p,ch,conf){var h='',pix=k=='pix',td=[];
 if(!S.volt)td.push('Read the voltage: look for DC5V, DC12V or DC24V on the strip edge, reel or power adapter');

function recs(k,v,p,ch){var pix=k=='pix',r=[],w=pix?'a 60 LED per metre pixel strip can draw about 18 W per metre at full white':'5050 colour strips use roughly 7 to 14 W per metre, simpler strips often less';
 r.push(['Power supply','A regulated '+(v||'matching')+' DC supply. Add 20% headroom: watts = W per metre × length × 1.2. As a guide, '+w+'. Check the listing for the real figure.'+(v=='5V'?' For short runs, a USB-A or USB-C charger that supplies 5V at 2 A or more works, and one port can often power the controller too.':'')+(v=='24V'?' Check that any controller you pick is rated for 24V.':'')]);
 if(pix){r.push(['WLED','Free firmware for an ESP32 or ESP8266 board, with a web page, phone app, 100+ effects and per-LED control. Works with Home Assistant, Alexa and Google Home. The easiest way to unlock a pixel strip.']);

 else{if(k=='single')r.push(['Dimmer or relay','A PWM dimmer for brightness, or just a switch, relay or smart plug if you only need on and off.']);
  r.push(['Ready-made controller','A Wi-Fi, Bluetooth or remote controller that matches '+p+' pads and your voltage.']);
  r.push(['WLED or ESPHome','An ESP32 plus MOSFET driver boards can run this strip in WLED (PWM outputs) or in ESPHome as a '+{single:'monochromatic',rgb:'rgb',rgbw:'rgbw',rgbcct:'rgbww',cct:'cwww'}[k]+' light. The MOSFETs must be rated for your voltage and current.'])}
 r.push(['Relays and switching','A relay (or MOSFET) on the DC side switches the strip off completely. '+(pix?'Pixel strips keep drawing a small standby current even when off, so a relay on the supply saves power. ':'A relay only gives on and off, not dimming. ')+'For mains, use a ready-made smart plug or a relay module rated for the load.']);
 r.push(['Extras',pix?'A 1000 µF capacitor across power at the strip start, a 330 to 470 Ω resistor in the data line, a 3.3V to 5V level shifter when using an ESP32, a fuse on the supply, and power fed in at both ends of long strips.':'A fuse on the supply, wire thick enough for the current (long runs lose voltage), and an aluminium channel for bright strips.']);
 return r}
function inv(k){var pix=k=='pix',L,v,t;
 if(pix){v='Not normally. Pixel strips expect normal (non-inverted) data.';L=[['Data line','Normal polarity. Only invert if something between the controller and the strip flips it, such as a single transistor, a 74HC04 or 74HC14, or an optocoupler.']];t='If nothing lights, or you see random colours, check data polarity, timing and that grounds are joined.'}
 else if(S.pins>2){if(S.cc=='k'){v='No. This strip expects a normal signal.';L=[['Shared GND (common cathode)','Voltage on a colour pad lights that colour, so the signal is normal. It needs a controller that outputs voltage on the colour pads (high-side). A controller made for shared V+ strips will not work.']]}
  else{v='Yes. This strip expects an inverted signal.';L=[['Shared V+ (common anode)','A colour lights when its pad is pulled to ground, so each pad is active-low. A low-side N-channel MOSFET board already does this inversion in hardware, so the firmware stays normal. If a pad is wired straight to an output pin, invert that output.'+(S.cc=='?'?' You were not sure, but almost all strips are shared V+.':'')]]}
  t='If the strip is fully on at 0% and dim at 100%, the signal is the wrong way round. Flip the invert option in your firmware.'}

 return '<h3>Will you need inverted signals?</h3><p>'+v+'</p>'+list(L.map(function(x){return '<b>'+x[0]+':</b> '+x[1]}))+'<h3>How to test it</h3>'+list([t,'In WLED look for an invert option on the output. In ESPHome set inverted: true on the pin. Names vary by firmware version, so check its docs.'])}
